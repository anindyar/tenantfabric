# tenantfabric: a multi-team AI platform in one Kubernetes manifest.
# agentgateway (one API key per team) in front of inference, MCP tools and memory.
#
#   kubectl apply -f k8s/tenantfabric.yaml
#   kubectl -n tenantfabric wait --for=condition=complete job/models --timeout=30m     # pulls ~3 GB of example models
#   kubectl -n tenantfabric exec -i deploy/memsvc -- python - < tests/e2e.py          # end-to-end checks
#   kubectl -n tenantfabric port-forward svc/agentgateway 8080:8080                    # then http://localhost:8080/ui
#   kubectl delete namespace tenantfabric                                              # remove everything
#
# Needs: a default StorageClass (4 PVCs, ~17Gi) and, for the NetworkPolicies to take effect, a CNI that enforces them.
# The demo keys and passwords are placeholders. Change them before exposing this anywhere.
# Keep the schema and gateway config in sync with docker-compose.yml.
apiVersion: v1
kind: Namespace
metadata:
  name: tenantfabric
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: tenantfabric
stringData:
  POSTGRES_PASSWORD: tenantfabric
  MEM_DB: postgresql://memsvc:memsvc@postgres:5432/postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: tenantfabric
data:
  01-schema.sql: |
    create extension if not exists vector;
    create database agwlogs;               -- agentgateway request logs (UI Logs page)

    -- One table for every memory, whatever the storage mode:
    --   source = 'md'  index entry derived from a markdown file (path + line point back to it)
    --   source = 'pg'  the row IS the memory (no file)
    create table memory (
      id        bigserial primary key,
      tenant    text not null,
      source    text not null,
      path      text,
      line      int,
      content   text not null,
      tags      text[] not null default '{}',
      embedding vector(768) not null,      -- must match the embedding model (nomic-embed-text = 768)
      created   timestamptz not null default now()
    );
    create index memory_hnsw on memory using hnsw (embedding vector_cosine_ops);
    create index memory_tenant on memory (tenant, source, path);

    -- memsvc connects as a non-owner role, so row-level security applies to it.
    create role memsvc login password 'memsvc';
    grant select, insert, update, delete on memory to memsvc;
    grant usage on sequence memory_id_seq to memsvc;
    alter table memory enable row level security;
    create policy tenant_isolation on memory
      using (tenant = current_setting('app.tenant', true))
      with check (tenant = current_setting('app.tenant', true));
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tenantfabric
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tenantfabric
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: tenantfabric }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: tenantfabric }
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg17
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } }
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports: [{ containerPort: 5432 }]
        readinessProbe:
          exec: { command: ["pg_isready", "-U", "postgres"] }
          periodSeconds: 5
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data }
        - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
      - name: init
        configMap: { name: postgres-init }
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      resources: { requests: { storage: 5Gi } }
---
# Example model server (CPU). Swap for vLLM/TGI/a cloud API by editing the gateway config below.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: tenantfabric
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: tenantfabric
spec:
  selector: { app.kubernetes.io/name: ollama }
  ports: [{ name: http, port: 11434 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: tenantfabric
  labels: { app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: tenantfabric }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: ollama }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: tenantfabric }
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports: [{ containerPort: 11434 }]
        readinessProbe:
          exec: { command: ["ollama", "list"] }
          periodSeconds: 5
        resources:
          requests: { cpu: "1", memory: 4Gi }
        volumeMounts:
        - { name: models, mountPath: /root/.ollama }
      volumes:
      - name: models
        persistentVolumeClaim: { claimName: models }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: models
  namespace: tenantfabric
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: { app.kubernetes.io/name: models, app.kubernetes.io/part-of: tenantfabric }
    spec:
      restartPolicy: OnFailure
      containers:
      - name: pull
        image: ollama/ollama:latest
        env: [{ name: OLLAMA_HOST, value: "http://ollama:11434" }]
        command: ["/bin/sh", "-c"]
        args:
        - until ollama list >/dev/null 2>&1; do sleep 3; done;
          ollama pull nomic-embed-text && ollama pull qwen2.5:0.5b && ollama pull moondream
---
# Memory MCP service. It trusts the X-Team header, so the NetworkPolicy below admits only the gateway.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memory
  namespace: tenantfabric
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: memsvc
  namespace: tenantfabric
spec:
  selector: { app.kubernetes.io/name: memsvc }
  ports: [{ name: http, port: 8041 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memsvc
  namespace: tenantfabric
  labels: { app.kubernetes.io/name: memsvc, app.kubernetes.io/part-of: tenantfabric }
spec:
  replicas: 1                     # md mode writes files on a RWO volume: keep one replica
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: memsvc }
  template:
    metadata:
      labels: { app.kubernetes.io/name: memsvc, app.kubernetes.io/part-of: tenantfabric }
    spec:
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true }
      containers:
      - name: memsvc
        image: ghcr.io/anindyar/memsvc:latest
        env:
        - { name: HOST, value: "0.0.0.0" }
        - { name: PORT, value: "8041" }
        - name: MEM_DB
          valueFrom: { secretKeyRef: { name: postgres, key: MEM_DB } }
        - { name: MEM_GATEWAY, value: "http://agentgateway:8080" }
        - { name: MEM_GATEWAY_KEY, value: sk-memsvc-demo }
        - { name: MEM_MODES, value: "alpha=md,beta=pg" }     # per-team storage mode: md = markdown + index, pg = pgvector only
        ports: [{ containerPort: 8041 }]
        readinessProbe:
          tcpSocket: { port: 8041 }
          periodSeconds: 5
        volumeMounts:
        - { name: memory, mountPath: /srv/memory }
      volumes:
      - name: memory
        persistentVolumeClaim: { claimName: memory }
---
# The gateway: keys, model aliases, per-model and per-tool rules, X-Team stamping.
apiVersion: v1
kind: Secret
metadata:
  name: agentgateway-config
  namespace: tenantfabric
stringData:
  config.yaml: |
    config:
      adminAddr: 127.0.0.1:15000
      statsAddr: 0.0.0.0:15020
      readinessAddr: 0.0.0.0:15021
      database:
        url: postgresql://postgres:tenantfabric@postgres:5432/agwlogs

    gateways:
      default:
        port: 8080
        protocol: HTTP

    llm:
      policies:
        # One API key per team. The same keys scope MCP below (YAML anchor).
        apiKey: &teamKeys
          mode: strict
          keys:
          - key: sk-alpha-demo
            metadata: { team: alpha }
          - key: sk-beta-demo
            metadata: { team: beta }
          - key: sk-memsvc-demo          # memsvc's own key, used only for embeddings
            metadata: { team: platform }

      # Teams call stable aliases. Point each alias at any OpenAI-compatible backend;
      # changing a backend is a one-line edit here, with no client changes.
      models:
      - name: chat-general              # example backend: qwen2.5:0.5b on ollama
        provider: { custom: { formats: [ { type: completions } ] } }
        params: { apiKey: dummy, model: "qwen2.5:0.5b", baseUrl: "http://ollama:11434" }
        authorization:
          rules: [ 'apiKey.team == "alpha"' ]
      - name: chat-vision               # example backend: moondream (image + text) on ollama
        provider: { custom: { formats: [ { type: completions } ] } }
        params: { apiKey: dummy, model: moondream, baseUrl: "http://ollama:11434" }
        authorization:
          rules: [ 'apiKey.team == "beta"' ]
      - name: embed                     # example backend: nomic-embed-text on ollama (768-dim)
        provider: { custom: { formats: [ { type: embeddings } ] } }
        params: { apiKey: dummy, model: nomic-embed-text, baseUrl: "http://ollama:11434" }
        authorization:
          rules: [ 'apiKey.team in ["alpha", "beta", "platform"]' ]

    mcp:
      targets:
      - name: memory
        mcp: { host: "http://memsvc:8041/mcp" }
      policies:
        apiKey: *teamKeys
        # Stamp the caller's team on every memory call (overrides anything the client sent).
        transformations:
          request:
            set:
              x-team: 'apiKey.team'
        mcpAuthorization:
          rules:
          - 'apiKey.team == "alpha"'                                                                   # alpha: all memory tools
          - 'apiKey.team == "beta" && mcp.tool.name in ["memory_search", "memory_get", "memory_write"]' # beta: no forget/reindex

    ui: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: tenantfabric
spec:
  selector: { app.kubernetes.io/name: agentgateway }
  ports: [{ name: http, port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: tenantfabric
  labels: { app.kubernetes.io/name: agentgateway, app.kubernetes.io/part-of: tenantfabric }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: agentgateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentgateway, app.kubernetes.io/part-of: tenantfabric }
    spec:
      containers:
      - name: agentgateway
        image: ghcr.io/agentgateway/agentgateway:v1.5.0
        args: ["-f", "/etc/agentgateway/config.yaml"]
        ports: [{ containerPort: 8080 }]
        readinessProbe:
          httpGet: { path: /healthz/ready, port: 15021 }
          periodSeconds: 5
        volumeMounts:
        - { name: config, mountPath: /etc/agentgateway, readOnly: true }
      volumes:
      - name: config
        secret: { secretName: agentgateway-config }
---
# Only the gateway may reach memsvc (memsvc trusts the X-Team header the gateway sets).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memsvc-from-gateway-only
  namespace: tenantfabric
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: memsvc } }
  policyTypes: [Ingress]
  ingress:
  - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: agentgateway } } }]
    ports: [{ port: 8041 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-platform-only
  namespace: tenantfabric
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: { matchLabels: { app.kubernetes.io/name: memsvc } }
    - podSelector: { matchLabels: { app.kubernetes.io/name: agentgateway } }
    ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-from-gateway-only
  namespace: tenantfabric
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: ollama } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: { matchLabels: { app.kubernetes.io/name: agentgateway } }
    - podSelector: { matchLabels: { app.kubernetes.io/name: models } }
    ports: [{ port: 11434 }]
